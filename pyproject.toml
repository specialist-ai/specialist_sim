[project]
name = "specialist-sim"
version = "1.0.0"
description = "A simulated capture rig for evaluating manipulation policies"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.12",
  "warp-lang>=1.16",
  "specialist-description",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.15.0", "mypy>=1.13", "pre-commit>=3.8"]

[tool.uv.sources]
specialist-description = { git = "ssh://git@github.com/specialist-ai/specialist_description.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/specialist_sim", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
# warp's array and kernel annotations are not Python types.
exclude = ["src/specialist_sim/kernels.py", "src/specialist_sim/render.py"]

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*", "warp", "warp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["specialist_sim.kernels", "specialist_sim.render"]
follow_imports = "skip"
