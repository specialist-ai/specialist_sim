[project]
name = "specialist-sim"
version = "0.2.0"
description = "A simulated capture rig for evaluating manipulation policies"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.12",
  "warp-lang>=1.16",
  "specialist-description",
]

[project.optional-dependencies]
# Reading the corpus a policy was trained on, to derive where its picks begin.
corpus = ["rerun-sdk[datafusion]>=0.36"]
# The spaces as Gymnasium objects.
gym = ["gymnasium>=1.3"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
  # Conformance only: the environment follows the Gymnasium interface but does
  # not import it.
  "gymnasium>=1.3",
]

[tool.uv.sources]
specialist-description = { git = "ssh://git@github.com/specialist-ai/specialist_description.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/specialist_sim", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
# warp is untyped: its array and kernel annotations are not Python types, and
# every call into it reads as untyped.
exclude = [
  "src/specialist_sim/render/kernels.py",
  "src/specialist_sim/render/renderer.py",
  "tests/sampler.py",
]

[[tool.mypy.overrides]]
module = [
  "mujoco", "mujoco.*",
  "warp", "warp.*",
  "gymnasium", "gymnasium.*",
  "pyarrow", "pyarrow.*",
  "datafusion", "datafusion.*",
  "rerun", "rerun.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sampler", "specialist_sim.render.kernels", "specialist_sim.render.renderer"]
follow_imports = "skip"
