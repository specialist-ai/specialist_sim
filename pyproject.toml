[project]
name = "specialist-sim"
version = "0.2.0"
description = "A simulated capture rig for evaluating manipulation policies"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.12",
  "warp-lang>=1.16",
]

[project.optional-dependencies]
# The spaces as Gymnasium objects.
gym = ["gymnasium>=1.3"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
  # Conformance only: the environment follows the Gymnasium interface but does
  # not import it.
  "gymnasium>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/specialist_sim", "tests"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "mujoco", "mujoco.*",
  "warp", "warp.*",
  "gymnasium", "gymnasium.*",
]
ignore_missing_imports = true
