[project]
name = "specialist-sim"
version = "1.0.0"
description = "A simulated capture rig for evaluating manipulation policies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "numpy",
  "mujoco>=3.17",
  "warp-lang>=1.16",
  "specialist-description",
]

[project.optional-dependencies]
# A recorded session, read back and replayed into the environment.
dataset = ["specialist-dataset", "av>=13"]

[project.scripts]
sim-replay = "specialist_sim.scripts.replay:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.15.0", "mypy>=1.13", "pre-commit>=3.8"]

[tool.uv.sources]
specialist-description = { git = "ssh://git@github.com/specialist-ai/specialist_description.git", branch = "main" }
specialist-dataset = { git = "ssh://git@github.com/specialist-ai/specialist.git", subdirectory = "packages/specialist_dataset", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["specialist_sim.env.Cfg"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/specialist_sim", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
# warp's array and kernel annotations are not Python types.
exclude = ["src/specialist_sim/camera/kernels.py", "src/specialist_sim/camera/render.py"]

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*", "warp", "warp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["specialist_sim.camera.kernels", "specialist_sim.camera.render"]
follow_imports = "skip"
